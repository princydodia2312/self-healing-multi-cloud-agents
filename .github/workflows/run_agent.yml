name: Run Self-Healing Agent (AWS)

on:
  workflow_dispatch:
    inputs:

      pipeline:
        description: 'Pipeline to run (skip = only run the selected steps above)'
        required: true
        type: choice
        options:
          - skip
          - eu_sales
        default: eu_sales

      bootstrap_cloud:
        description: 'Provision baseline infrastructure? (first setup only)'
        required: true
        type: choice
        options:
          - skip
          - aws
        default: skip

      sync_knowledge_base:
        description: 'Sync Knowledge Base to Pinecone?'
        required: true
        type: choice
        options:
          - skip
          - sync
        default: skip

      inject_chaos:
        description: 'Inject dirty/chaos data into the database?'
        required: true
        type: choice
        options:
          - skip
          - inject
        default: skip

      chaos_target:
        description: 'Chaos target pipeline (only if inject_chaos = inject)'
        required: false
        type: choice
        options:
          - eu_sales
        default: eu_sales

      chaos_db_type:
        description: 'Database type for chaos injection'
        required: false
        type: choice
        options:
          - postgres
          - sqlite
        default: postgres

      chaos_rows:
        description: 'Number of dirty rows to inject'
        required: false
        default: '100'
        type: string

permissions:
  contents: read   # agent pushes use GH_PAT, never the workflow GITHUB_TOKEN

jobs:
  run-agent:
    runs-on: ubuntu-latest

    env:
      # ── LangSmith Tracing ────────────────────────────────────────────────────
      LANGCHAIN_TRACING_V2: ${{ vars.LANGCHAIN_TRACING_V2 }}
      LANGCHAIN_PROJECT:    ${{ vars.LANGCHAIN_PROJECT }}
      LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}

      # ── LLM ─────────────────────────────────────────────────────────────────
      LLM_MODEL:         ${{ vars.LLM_MODEL }}
      LLM_PROVIDER:      ${{ vars.LLM_PROVIDER }}
      LLM_TIMEOUT_SEC:   ${{ vars.LLM_TIMEOUT_SEC }}
      LLM_MAX_RETRIES:   ${{ vars.LLM_MAX_RETRIES }}
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Vector Store ─────────────────────────────────────────────────────────
      PINECONE_API_KEY:    ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME }}

      # ── GitHub ───────────────────────────────────────────────────────────────
      GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}

      # ── AWS — credentials for SSM access (DB config read from SSM at runtime)
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}

      # ── Trino & Prometheus ────────────────────────────────────────────────────
      TRINO_HOST:     ${{ vars.TRINO_HOST }}
      TRINO_PORT:     ${{ vars.TRINO_PORT }}
      TRINO_USER:     ${{ vars.TRINO_USER }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Install dependencies
        run: uv sync

      # ── STEP 1: Bootstrap (optional, first setup only) ───────────────────────
      # Terraform is always installed — the infra agent uses it for pipeline-level
      # infrastructure (S3 bucket, IAM policy) even when bootstrap is skipped.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "~1.9"
          # Disable the output-capturing wrapper: with it ON, a failed `terraform apply`
          # surfaces only as a generic "Terraform exited with code 1" and the real
          # `│ Error:` block is swallowed. No step consumes the wrapper's stdout/exitcode
          # outputs, so turning it off is pure error visibility (no behavioural change).
          terraform_wrapper: false

      - name: Bootstrap — AWS
        if: inputs.bootstrap_cloud == 'aws'
        working-directory: bootstrap/aws
        env:
          # Bootstrap uses a dedicated admin IAM user — NOT the runtime service account.
          # The runtime user (AWS_ACCESS_KEY_ID) has only SSM read permissions.
          AWS_ACCESS_KEY_ID:     ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION }}
          TF_VAR_rds_allowed_cidrs: ${{ vars.TF_VAR_RDS_ALLOWED_CIDRS }}
          TF_VAR_pipeline_iam_arn:  ${{ vars.TF_VAR_PIPELINE_IAM_ARN }}
        run: |
          terraform init
          terraform apply -auto-approve
          echo "✅ AWS bootstrap complete. RDS + EKS + SSM populated."

      # ── STEP 2: Sync Knowledge Base (optional) ───────────────────────────────
      - name: Sync Knowledge Base to Pinecone
        if: inputs.sync_knowledge_base == 'sync'
        run: uv run python scripts/ingest_to_pinecone.py

      # ── STEP 3: Inject chaos data (optional) ────────────────────────────────
      - name: Inject chaos data
        if: inputs.inject_chaos == 'inject'
        # Inputs go through env, never interpolated straight into the shell — a free-string input
        # (chaos_rows) could otherwise inject shell commands into the run block.
        env:
          CHAOS_TARGET: ${{ inputs.chaos_target }}
          CHAOS_DB_TYPE: ${{ inputs.chaos_db_type }}
          CHAOS_ROWS: ${{ inputs.chaos_rows }}
        run: |
          uv run python scripts/seed_chaos.py \
            --target "$CHAOS_TARGET" \
            --db-type "$CHAOS_DB_TYPE" \
            --rows "$CHAOS_ROWS"

      # ── STEP 4: Run the agent ────────────────────────────────────────────────
      - name: Run agent
        if: inputs.pipeline != 'skip'
        run: uv run python main.py "${{ inputs.pipeline }}"
